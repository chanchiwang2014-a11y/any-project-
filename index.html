<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist Video Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="playlist" aria-label="Playlist">
      <h1>Playlist</h1>
      <ul id="playlist"></ul>
    </aside>
    <main class="player">
      <div class="player__viewport">
        <video id="video" preload="metadata"></video>
      </div>
      <div class="controls" aria-label="Video controls">
        <div class="controls__row">
          <button id="play-pause" type="button" aria-label="Play or pause">▶️</button>
          <button id="skip-back" type="button" aria-label="Back 10 seconds">⏪ 10s</button>
          <button id="skip-forward" type="button" aria-label="Forward 10 seconds">10s ⏩</button>
          <button id="mute" type="button" aria-label="Mute or unmute">🔈</button>
          <input id="volume" type="range" min="0" max="1" step="0.01" aria-label="Volume" />
          <button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
        </div>
        <div class="controls__row">
          <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
          <span id="time" class="time">00:00 / 00:00</span>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
