<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinematic Player</title>
  <!-- External font for a sleek Netflix-inspired look -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="player-shell">
      <!-- Poster overlay gives a subtle vignette effect behind the custom controls -->
      <video
        id="video"
        class="player"
        preload="metadata"
        poster="https://images.unsplash.com/photo-1512428559087-560fa5ceab42?auto=format&fit=crop&w=1200&q=80"
        controlsList="nodownload noremoteplayback"
        disablepictureinpicture
        playsinline
      >
        <!-- Sample media; replace src with your own MP4 for production use -->
        <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>

      <!-- Custom control bar (native controls are intentionally omitted) -->
      <div class="controls" aria-label="Video controls">
        <div class="controls-left">
          <button id="play-pause" class="control-btn" aria-label="Play or pause">
            <span class="icon" data-icon="play">▶</span>
          </button>
          <button id="rewind" class="control-btn" aria-label="Rewind 10 seconds">
            <span class="icon">⏪ 10s</span>
          </button>
          <button id="forward" class="control-btn" aria-label="Forward 10 seconds">
            <span class="icon">10s ⏩</span>
          </button>
          <div class="time">
            <!-- Remaining time updates as the video plays -->
            <span id="remaining">-00:00</span>
          </div>
        </div>

        <div class="timeline" aria-label="Seek bar">
          <!-- Buffered progress sits behind the playhead fill -->
          <div class="buffer-bar">
            <div id="buffered" class="buffered-fill"></div>
          </div>
          <div class="progress-bar">
            <div id="progress" class="progress-fill"></div>
            <div id="thumb" class="progress-thumb" role="presentation"></div>
          </div>
          <!-- Hover preview; uses a placeholder gradient thumbnail and calculated timestamp -->
          <div id="preview" class="preview" role="presentation">
            <div class="preview-thumb"></div>
            <div id="preview-time" class="preview-time">00:00</div>
          </div>
          <!-- Invisible input captures dragging/keyboard for scrubbing without native controls -->
          <input id="seek" class="seek-input" type="range" min="0" value="0" step="0.1" aria-label="Seek slider" />
        </div>

        <div class="controls-right">
          <button id="fullscreen" class="control-btn" aria-label="Toggle fullscreen">
            <span class="icon" data-icon="fullscreen">⛶</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="player.js"></script>
</body>
</html>
